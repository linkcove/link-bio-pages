<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Page Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; }
  body { font-family:"Poppins", sans-serif; min-height:100vh; background:#0e0e10;
    display:flex; justify-content:center; }
  .wrap { max-width:480px; width:100%; min-height:100vh; margin:0 auto; padding:48px 20px 60px;
    display:flex; flex-direction:column; align-items:center;
    background-image:linear-gradient(160deg,#16361f,#1e7a36);
    background-size:cover; background-position:center; }
  @media (min-width:481px) {
    body { padding:40px 0; }
    .wrap { min-height:760px; border-radius:28px; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  }
  .avatar { width:110px; height:110px; border-radius:50%; object-fit:cover; border:4px solid rgba(255,255,255,.9); box-shadow:0 4px 18px rgba(0,0,0,.35); }
  h1 { color:#fff; font-size:1.5rem; font-weight:700; text-shadow:0 2px 6px rgba(0,0,0,.4); margin:14px 0 22px; text-align:center; }
  .embed { width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; box-shadow:0 6px 20px rgba(0,0,0,.35); margin-bottom:22px; }
  .embed iframe { width:100%; height:100%; border:0; }
  .linkbtn { display:block; width:100%; text-align:center; background:#fff; color:#15301c; text-decoration:none;
    font-weight:600; padding:15px 18px; border-radius:14px; margin-bottom:12px; box-shadow:0 3px 10px rgba(0,0,0,.25);
    transition:transform .15s ease, box-shadow .15s ease; }
  .linkbtn:hover { transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.3); }
  .socials { display:flex; gap:18px; margin-top:24px; }
  .social { color:#fff; opacity:.9; }
  .social:hover { opacity:1; }
  .footer { margin-top:30px; font-size:.7rem; color:rgba(255,255,255,.6); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fresh Page Test</h1>

<a class="linkbtn" href="https://example.com" target="_blank" rel="noopener sponsored">Test</a>
</div>
</body>
</html>
